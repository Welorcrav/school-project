<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Good Friends Campaign</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-800/80 backdrop-blur-md p-6 rounded-3xl border border-slate-700 shadow-xl">
            <div>
                <span class="bg-purple-500/20 text-purple-300 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-purple-500/30">Control Center</span>
                <h1 class="font-heading text-2xl sm:text-3xl font-bold text-white mt-1">Admin Panel</h1>
            </div>
            <a href="index.html" class="inline-flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition-all">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Site
            </a>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="bg-slate-800/80 backdrop-blur-md p-6 rounded-3xl border border-slate-700 shadow-xl flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-sm font-medium">Total Campaign Likes</p>
                    <h3 id="admin-likes" class="text-4xl font-heading font-extrabold text-rose-400 mt-2">...</h3>
                </div>
                <div class="w-14 h-14 rounded-2xl bg-rose-500/10 text-rose-400 flex items-center justify-center border border-rose-500/20">
                    <i data-lucide="heart" class="w-7 h-7 fill-current"></i>
                </div>
            </div>

            <div class="bg-slate-800/80 backdrop-blur-md p-6 rounded-3xl border border-slate-700 shadow-xl flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-sm font-medium">Project Status</p>
                    <h3 class="text-xl font-heading font-bold text-emerald-400 mt-2">Active & Live 🚀</h3>
                </div>
                <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
                    <i data-lucide="shield-check" class="w-7 h-7"></i>
                </div>
            </div>
        </div>

        <!-- Actions Control Card -->
        <div class="bg-slate-800/80 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
            <h2 class="font-heading text-xl font-bold text-white flex items-center gap-2">
                <i data-lucide="sliders" class="w-5 h-5 text-purple-400"></i> Manage Likes Data
            </h2>
            
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <input type="number" id="new-likes-input" placeholder="Set new likes count" class="w-full sm:w-auto flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-purple-500">
                <button onclick="updateLikesCount()" class="w-full sm:w-auto bg-purple-600 hover:bg-purple-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Update Likes
                </button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        lucide.createIcons();

        // FIREBASE CONFIGURATION (Asosiy kalitlaringiz)
        const firebaseConfig = {
            apiKey: "AIzaSyAgJnEOr1ARCk0iBMpD6NsNiIldPmyi8Ig",
            authDomain: "english-project-17.firebaseapp.com",
            projectId: "english-project-17",
            storageBucket: "english-project-17.firebasestorage.app",
            messagingSenderId: "877460603584",
            appId: "1:877460603584:web:045a61f1e15a239753a325",
            measurementId: "G-DN11972DD3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Load Likes in Admin
        async function loadAdminStats() {
            try {
                const docRef = db.collection("campaign").doc("likesData");
                const doc = await docRef.get();
                if (doc.exists) {
                    document.getElementById('admin-likes').innerText = doc.data().count || 0;
                } else {
                    document.getElementById('admin-likes').innerText = "0";
                }
            } catch (e) {
                document.getElementById('admin-likes').innerText = "Error";
            }
        }
        loadAdminStats();

        // Update Likes Manually from Admin
        async function updateLikesCount() {
            const val = document.getElementById('new-likes-input').value;
            if (val === "" || isNaN(val)) {
                alert("Iltimos, to'g'ri raqam kiriting!");
                return;
            }
            try {
                const docRef = db.collection("campaign").doc("likesData");
                await docRef.set({ count: parseInt(val) });
                document.getElementById('admin-likes').innerText = val;
                alert("Like soni muvaffaqiyatli yangilandi!");
                document.getElementById('new-likes-input').value = "";
            } catch (e) {
                alert("Xatolik yuz berdi!");
            }
        }
    </script>
</body>
</html>
