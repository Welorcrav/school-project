<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Good Friends Campaign</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- 1. LOGIN FORM SECTION (KIRISH OYNASI) -->
    <div id="login-section" class="max-w-md w-full bg-slate-800/90 backdrop-blur-md p-8 rounded-3xl border border-slate-700 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-purple-600/20 text-purple-400 rounded-2xl flex items-center justify-center mx-auto border border-purple-500/30">
                <i data-lucide="lock" class="w-7 h-7"></i>
            </div>
            <h2 class="font-heading text-2xl font-bold text-white">Admin Login</h2>
            <p class="text-slate-400 text-xs">Admin panelga kirish uchun ma'lumotlarni kiriting</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Username</label>
                <div class="relative">
                    <input type="text" id="username" required placeholder="Enter username" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 pl-10 text-white text-sm focus:outline-none focus:border-purple-500 transition-all">
                    <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="Enter password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 pl-10 text-white text-sm focus:outline-none focus:border-purple-500 transition-all">
                    <i data-lucide="key" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                </div>
            </div>

            <p id="login-error" class="text-rose-400 text-xs font-medium hidden text-center">❌ Username yoki parol xato!</p>

            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i> Login
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition-colors">← Back to Main Site</a>
        </div>
    </div>


    <!-- 2. ADMIN DASHBOARD SECTION -->
    <div id="admin-dashboard" class="hidden max-w-4xl w-full mx-auto space-y-8">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-800/80 backdrop-blur-md p-6 rounded-3xl border border-slate-700 shadow-xl">
            <div>
                <span class="bg-purple-500/20 text-purple-300 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-purple-500/30">Control Center</span>
                <h1 class="font-heading text-2xl sm:text-3xl font-bold text-white mt-1">Admin Panel</h1>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="inline-flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition-all">
                    <i data-lucide="globe" class="w-4 h-4"></i> View Site
                </a>
                <button onclick="handleLogout()" class="inline-flex items-center gap-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 text-sm font-medium px-4 py-2.5 rounded-xl transition-all">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="bg-slate-800/80 backdrop-blur-md p-6 rounded-3xl border border-slate-700 shadow-xl flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-sm font-medium">Total Campaign Likes</p>
                    <h3 id="admin-likes" class="text-4xl font-heading font-extrabold text-rose-400 mt-2">...</h3>
                </div>
                <div class="w-14 h-14 rounded-2xl bg-rose-500/10 text-rose-400 flex items-center justify-center border border-rose-500/20">
                    <i data-lucide="heart" class="w-7 h-7 fill-current"></i>
                </div>
            </div>

            <div class="bg-slate-800/80 backdrop-blur-md p-6 rounded-3xl border border-slate-700 shadow-xl flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-sm font-medium">Project Status</p>
                    <h3 class="text-xl font-heading font-bold text-emerald-400 mt-2">Active & Live 🚀</h3>
                </div>
                <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
                    <i data-lucide="shield-check" class="w-7 h-7"></i>
                </div>
            </div>
        </div>

        <!-- Manage Likes Control Card -->
        <div class="bg-slate-800/80 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
            <h2 class="font-heading text-xl font-bold text-white flex items-center gap-2">
                <i data-lucide="sliders" class="w-5 h-5 text-purple-400"></i> Manage Likes Data
            </h2>
            
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <input type="number" id="new-likes-input" placeholder="Set new likes count" class="w-full sm:w-auto flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-purple-500">
                <button onclick="updateLikesCount()" class="w-full sm:w-auto bg-purple-600 hover:bg-purple-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Update Likes
                </button>
            </div>
        </div>

        <!-- Add New Friendship Tip Card -->
        <div class="bg-slate-800/80 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-slate-700 shadow-xl space-y-6">
            <h2 class="font-heading text-xl font-bold text-white flex items-center gap-2">
                <i data-lucide="lightbulb" class="w-5 h-5 text-amber-400"></i> Add New Friendship Tip
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Tip Text (Ingliz tilida)</label>
                    <textarea id="new-tip-input" rows="3" placeholder="Type a new friendship tip here... (e.g., Share your dreams with your best friend! ✨)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-purple-500 transition-all"></textarea>
                </div>
                <button onclick="addNewTip()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Add Tip to Database
                </button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        lucide.createIcons();

        // 🔐 CREDENTIALS
        const ADMIN_USER = "igamberdiyev19";
        const ADMIN_PASS = "Behruzbek12";

        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAgJnEOr1ARCk0iBMpD6NsNiIldPmyi8Ig",
            authDomain: "english-project-17.firebaseapp.com",
            projectId: "english-project-17",
            storageBucket: "english-project-17.firebasestorage.app",
            messagingSenderId: "877460603584",
            appId: "1:877460603584:web:045a61f1e15a239753a325",
            measurementId: "G-DN11972DD3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Check session on page load
        if (sessionStorage.getItem("adminLogged") === "true") {
            showDashboard();
        }

        // Handle Login Submission
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            const err = document.getElementById("login-error");

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                sessionStorage.setItem("adminLogged", "true");
                err.classList.add("hidden");
                showDashboard();
            } else {
                err.classList.remove("hidden");
            }
        }

        // Show Dashboard and Hide Login
        function showDashboard() {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("admin-dashboard").classList.remove("hidden");
            document.body.classList.remove("flex", "items-center", "justify-center");
            loadAdminStats();
        }

        // Handle Logout
        function handleLogout() {
            sessionStorage.removeItem("adminLogged");
            location.reload();
        }

        // Load Likes in Admin
        async function loadAdminStats() {
            try {
                const docRef = db.collection("campaign").doc("likesData");
                const doc = await docRef.get();
                if (doc.exists) {
                    document.getElementById('admin-likes').innerText = doc.data().count || 0;
                } else {
                    document.getElementById('admin-likes').innerText = "0";
                }
            } catch (e) {
                document.getElementById('admin-likes').innerText = "Error";
            }
        }

        // Update Likes Manually
        async function updateLikesCount() {
            const val = document.getElementById('new-likes-input').value;
            if (val === "" || isNaN(val)) {
                alert("Iltimos, to'g'ri raqam kiriting!");
                return;
            }
            try {
                const docRef = db.collection("campaign").doc("likesData");
                await docRef.set({ count: parseInt(val) }, { merge: true });
                document.getElementById('admin-likes').innerText = val;
                alert("Like soni muvaffaqiyatli yangilandi!");
                document.getElementById('new-likes-input').value = "";
            } catch (e) {
                alert("Xatolik yuz berdi!");
            }
        }

        // Add New Friendship Tip
        async function addNewTip() {
            const tipText = document.getElementById('new-tip-input').value.trim();
            if (!tipText) {
                alert("Iltimos, maslahat matnini kiriting!");
                return;
            }
            try {
                // Yangi tipni Firestore bazasidagi 'tips' kolleksiyasiga qo'shamiz
                await db.collection("campaign_tips").add({
                    text: tipText,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Yangi do'stlik maslahati bazaga muvaffaqiyatli qo'shildi! 🎉");
                document.getElementById('new-tip-input').value = "";
            } catch (e) {
                alert("Maslahatni qo'shishda xatolik yuz berdi: " + e.message);
            }
        }
    </script>
</body>
</html>
